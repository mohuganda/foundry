name: Foundry CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/foundry
      - name: Embedded generation smoke check
        if: runner.os == 'Linux'
        run: make smoke

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: make format-check

  cross-compile:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: make release VERSION=ci

  web-templates:
    name: Web template (${{ matrix.template }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [vanilla-js, react]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}-foundations/package-lock.json
      - name: Generate the bundled template
        run: |
          go run ./cmd/foundry auth example > "$RUNNER_TEMP/auth.json"
          go run ./cmd/foundry new web-check --template ${{ matrix.template }} --profile moh-uganda --auth-config "$RUNNER_TEMP/auth.json" --destination "$RUNNER_TEMP/foundry-web" --no-hooks
      - name: Scaffold and validate a web feature
        run: go run ./cmd/foundry add feature order-history --project "$RUNNER_TEMP/foundry-web"
      - run: npm ci
        working-directory: ${{ runner.temp }}/foundry-web
      - run: npm run check
        working-directory: ${{ runner.temp }}/foundry-web

  rust-template:
    name: Rust template (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.85.0'
    env:
      RUSTDOCFLAGS: -D warnings
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Rust tooling
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Generate the bundled template
        run: go run ./cmd/foundry new rust-check --template rust --profile moh-uganda --destination "${{ runner.temp }}/foundry-rust" --no-hooks
      - name: Scaffold and register a Rust feature
        shell: bash
        run: |
          go run ./cmd/foundry add feature order-history --project "$RUNNER_TEMP/foundry-rust"
          printf 'pub mod order_history;\n' >> "$RUNNER_TEMP/foundry-rust/src/features/mod.rs"
      - name: Rust quality gate (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/check.sh
        working-directory: ${{ runner.temp }}/foundry-rust
      - name: Rust quality gate (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
        working-directory: ${{ runner.temp }}/foundry-rust

  go-template:
    name: Generated Go identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: |
          go run ./cmd/foundry auth example > "$RUNNER_TEMP/auth.json"
          go run ./cmd/foundry new moh-backend --template go --profile moh-uganda --auth-config "$RUNNER_TEMP/auth.json" --destination "$RUNNER_TEMP/foundry-go" --no-hooks
      - run: go test ./...
        working-directory: ${{ runner.temp }}/foundry-go

  flutter-template:
    name: Flutter identity and Mason integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: templates/flutter_foundations/.fvmrc
          channel: stable
          cache: true
      - run: |
          go run ./cmd/foundry auth example > "$RUNNER_TEMP/auth.json"
          go run ./cmd/foundry new moh-flutter --template flutter --profile moh-uganda --auth-config "$RUNNER_TEMP/auth.json" --destination "$RUNNER_TEMP/foundry-flutter" --no-hooks
      - name: Connect pinned SDK and activate Mason
        run: |
          mkdir -p "$RUNNER_TEMP/foundry-flutter/.fvm"
          ln -s "$FLUTTER_ROOT" "$RUNNER_TEMP/foundry-flutter/.fvm/flutter_sdk"
          dart pub global activate mason_cli
      - name: Validate generated identity package and application bricks
        working-directory: ${{ runner.temp }}/foundry-flutter
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed packages/foundation_identity packages/foundation_auth
          dart analyze packages/foundation_auth
          dart analyze packages/foundation_identity
          flutter test --no-pub packages/foundation_auth/test packages/foundation_identity/test
          bash scripts/validate_bricks.sh

  keycloak-integration:
    name: Keycloak access-token integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go run ./cmd/foundry new auth-check --template go --profile moh-uganda --destination "$RUNNER_TEMP/foundry-keycloak" --no-hooks
      - run: bash auth/dev/start.sh
        working-directory: ${{ runner.temp }}/foundry-keycloak
      - run: go test ./internal/infrastructure/auth/oidc -run TestKeycloakIntegration -v
        working-directory: ${{ runner.temp }}/foundry-keycloak
        env:
          FOUNDRY_KEYCLOAK_TEST_CA: ${{ runner.temp }}/foundry-keycloak/auth/dev/certs/server.crt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect provider login layout in a real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/login-browser" playwright@1.64.1 --ignore-scripts
          export FOUNDRY_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/login-browser/node_modules/playwright/package.json"
          export FOUNDRY_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          export FOUNDRY_LOGIN_SCREENSHOTS="$RUNNER_TEMP/login-screenshots"
          node scripts/check-login-theme.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-login-preview
          path: ${{ runner.temp }}/login-screenshots
          if-no-files-found: ignore
      - name: Stop disposable identity provider
        if: always()
        run: docker compose -f "$RUNNER_TEMP/foundry-keycloak/auth/dev/compose.yaml" down

  docker:
    name: Docker distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=ci -t foundry:test .
      - run: ./scripts/test-docker.sh foundry:test
      - run: test "$(docker run --rm foundry:test version)" = 'foundry ci'

  homebrew:
    name: Homebrew distribution
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check and install the release formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/foundry.rb)
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/homebrew-release"
          ./scripts/homebrew-formula.sh "$version" "$RUNNER_TEMP/homebrew-release/SHA256SUMS" > "$RUNNER_TEMP/foundry.rb"
          diff -u Formula/foundry.rb "$RUNNER_TEMP/foundry.rb"
          ruby -c Formula/foundry.rb
          brew tap --custom-remote mohuganda/foundry "$GITHUB_WORKSPACE"
          brew install mohuganda/foundry/foundry
          brew test mohuganda/foundry/foundry
