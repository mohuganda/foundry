name: Foundry CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/foundry

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: test -z "$(gofmt -l .)"

  cross-compile:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: ./scripts/build-release.sh ci

  web-templates:
    name: Web template (${{ matrix.template }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [vanilla-js, react]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}-foundations/package-lock.json
      - name: Generate the bundled template
        run: go run ./cmd/foundry new web-check --template ${{ matrix.template }} --destination "$RUNNER_TEMP/foundry-web" --no-hooks
      - run: npm ci
        working-directory: ${{ runner.temp }}/foundry-web
      - run: npm run check
        working-directory: ${{ runner.temp }}/foundry-web
