name: Foundry CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/foundry
      - name: Embedded generation smoke check
        if: runner.os == 'Linux'
        run: make smoke

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: make format-check

  cross-compile:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: make release VERSION=ci

  web-templates:
    name: Web template (${{ matrix.template }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [vanilla-js, react]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}-foundations/package-lock.json
      - name: Generate the bundled template
        run: go run ./cmd/foundry new web-check --template ${{ matrix.template }} --destination "$RUNNER_TEMP/foundry-web" --no-hooks
      - run: npm ci
        working-directory: ${{ runner.temp }}/foundry-web
      - run: npm run check
        working-directory: ${{ runner.temp }}/foundry-web

  rust-template:
    name: Rust template (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.85.0'
    env:
      RUSTDOCFLAGS: -D warnings
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Rust tooling
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Generate the bundled template
        run: go run ./cmd/foundry new rust-check --template rust --destination "${{ runner.temp }}/foundry-rust" --no-hooks
      - name: Rust quality gate (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/check.sh
        working-directory: ${{ runner.temp }}/foundry-rust
      - name: Rust quality gate (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
        working-directory: ${{ runner.temp }}/foundry-rust
