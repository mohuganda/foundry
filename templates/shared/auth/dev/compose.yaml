# Local development only: self-signed TLS, disposable realm/database and test credentials.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      [
        start-dev,
        --import-realm,
        --hostname=https://localhost:8443,
        --http-enabled=false,
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-development-only}
      KC_HTTPS_CERTIFICATE_FILE: /certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/server.key
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./realm.json:/opt/keycloak/data/import/foundry-realm.json:ro
      - ./certs:/certs:ro
